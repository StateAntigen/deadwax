<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#315fa1" />
    <meta name="description" content="Deadwax — peer-to-peer sharing over Nostr and Tor" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // The stored theme is applied before the first paint, otherwise a light-mode
      // window flashes black for as long as Svelte takes to mount.
      (function () {
        try {
          var stored = localStorage.getItem('deadwax-theme');
          var light = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
